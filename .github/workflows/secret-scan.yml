name: secret-scan

on:
  push:
  pull_request:
  schedule:
    - cron: "17 5 * * 1"   # weekly, Mondays 05:17 UTC

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan every commit for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notebooks:
    name: notebooks carry no key placeholders
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail on hard-coded keys or leftover placeholders in notebooks
        run: |
          set -e
          if grep -rnE '(API_KEY|TOKEN|token)\s*=\s*\\?"([^"<\\]{20,}|<REDACTED>)\\?"|PASTE_KEY_HERE' --include='*.ipynb' --include='*.py' . ; then
            echo "::error::hard-coded key or placeholder found"; exit 1
          fi
          echo "clean"
