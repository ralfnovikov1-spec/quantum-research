name: daily-ibm-study

on:
  schedule:
    - cron: "17 6 * * *"        # 06:17 UTC every day
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-ibm-study
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -r daily/requirements.txt

      - name: Offline self-test (FakeKingston + Stim, no IBM)
        run: python daily/daily.py fake

      - name: Check secret
        env:
          IBM_QUANTUM_KEY: ${{ secrets.IBM_QUANTUM_KEY }}
        run: |
          if [ -z "$IBM_QUANTUM_KEY" ]; then
            echo "::error::Repository secret IBM_QUANTUM_KEY is not set"; exit 1
          fi

      - name: Collect, submit, report
        env:
          IBM_QUANTUM_KEY: ${{ secrets.IBM_QUANTUM_KEY }}
        run: python daily/daily.py run

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A daily/
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "daily: $(date -u +%F) results"
            git push
          fi
